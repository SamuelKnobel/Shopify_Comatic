services:
  - type: web
    name: shopify-comatic-bridge
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web.app:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SQLITE_DB_PATH
        value: /data/sync.db
      - key: SHOPIFY_SHOP
        sync: false # You will set this in Render UI
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: COMATIC_PAYMENT_ACCOUNTS
        value: '{"Wise": "1001", "Bank Transfer": "1002"}'
